name: US Swing Scanner
on:
  workflow_dispatch:
    inputs:
      action:
        description: Aufgabe (jetzt-scannen sendet gültige Treffer an Telegram)
        type: choice
        default: jetzt-scannen
        options: [jetzt-scannen, health, pair-test, backtest, verify, scan, catchup]
  schedule:
    # 01:47, 07:47, 13:47 and 19:47 in Manila/Cebu, year-round.
    - cron: '47 5,17,23 * * *'
      timezone: Etc/UTC
    # The last slot before the regular US open reports missing prices as an error.
    - cron: '47 11 * * *'
      timezone: Etc/UTC
permissions:
  contents: read
concurrency:
  group: swing-research-ledger
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.repository.visibility == 'public' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: ''
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Name weekly public price cache
        id: prices
        run: date -u '+key=public-prices-v1-%G-%V' >> "$GITHUB_OUTPUT"
      - name: Restore weekly public prices
        uses: actions/cache@v4
        with:
          path: .cache/public-prices
          key: ${{ steps.prices.outputs.key }}
      - name: Publish daily research or run selected task
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTION: ${{ inputs.action || 'jetzt-scannen' }}
          PRICE_RETRY_PLANNED: ${{ github.event_name == 'schedule' && github.event.schedule != '47 11 * * *' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PAIR_CODE: ${{ secrets.TELEGRAM_PAIR_CODE }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          PAPER_TELEGRAM: ${{ vars.PAPER_TELEGRAM }}
          INCLUDE_ETFS: ${{ vars.INCLUDE_ETFS }}
          PUBLISH_LEDGER: '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m swing.cli "$ACTION"
