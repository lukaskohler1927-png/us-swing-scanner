name: US Swing Scanner
on:
  workflow_dispatch:
    inputs:
      action:
        description: Aufgabe
        type: choice
        default: health
        options: [health, pair-test, backtest, verify, scan, catchup]
  schedule:
    - cron: '47 20 * * 1-5'
      timezone: America/New_York
    - cron: '17 7 * * 1-6'
      timezone: America/New_York
permissions:
  contents: read
concurrency:
  group: swing-research-ledger
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.repository.visibility == 'public' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: ''
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Publish daily research or run selected task
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTION: ${{ inputs.action || (github.event.schedule == '17 7 * * 1-6' && 'catchup' || 'scan') }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PAIR_CODE: ${{ secrets.TELEGRAM_PAIR_CODE }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          PAPER_TELEGRAM: ${{ vars.PAPER_TELEGRAM }}
          INCLUDE_ETFS: ${{ vars.INCLUDE_ETFS }}
          PUBLISH_LEDGER: '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m swing.cli "$ACTION"
