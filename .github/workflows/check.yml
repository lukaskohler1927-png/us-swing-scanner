name: Check scanner
on:
  push:
    paths:
      - 'swing/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  public:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: ''
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m swing.cli health
      - name: Name weekly public price cache
        id: prices
        run: date -u '+key=public-prices-v1-%G-%V' >> "$GITHUB_OUTPUT"
      - name: Restore weekly public prices
        uses: actions/cache@v4
        with:
          path: .cache/public-prices
          key: ${{ steps.prices.outputs.key }}
      - name: Verify whole market without credentials or delivery
        run: python -m swing.cli verify
      - name: Replay daily prices with an out-of-sample year
        run: python -m swing.cli backtest
